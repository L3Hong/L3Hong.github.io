name: Update Horror Movies

# Force Node.js 24 to avoid deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  # Allows manual trigger from Actions tab
  workflow_dispatch:

jobs:
  update-movies:
    runs-on: ubuntu-latest
    
    # IMPORTANT: Give the workflow permission to write to the repo
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Use the built-in GitHub token for authentication
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Fetch DailyMotion movies
        run: |
          echo "📡 Fetching DailyMotion: new horror full movie english (limit 150)..."
          curl -s "https://api.dailymotion.com/videos?search=new+horror+full+movie+english&limit=150&fields=id,title,description,thumbnail_240_url" > dm.json
          echo "✅ DailyMotion fetched"
          
      - name: Fetch Bilibili movies
        run: |
          echo "📡 Fetching Bilibili: new horror full movie english..."
          curl -s "https://api.bilibili.com/x/web-interface/search/type?search_type=video&keyword=new%20horror%20full%20movie%20english&page=1" > bili.json
          echo "✅ Bilibili fetched"
          
      - name: Combine movies into JSON
        run: |
          node -e "
            const fs = require('fs');
            
            console.log('🔄 Combining movies from all sources...');
            
            // DailyMotion
            let dmMovies = [];
            try {
              const dm = JSON.parse(fs.readFileSync('dm.json'));
              if (dm.list) {
                dmMovies = dm.list.map(v => ({
                  title: v.title || 'Untitled Horror',
                  link: 'https://www.dailymotion.com/video/' + v.id,
                  thumbnail: v.thumbnail_240_url || 'https://via.placeholder.com/320x180/1f262e/6b7b8b?text=DM',
                  description: (v.description || 'Full horror movie on DailyMotion').slice(0, 150),
                  source: 'dailymotion'
                }));
                console.log('  📺 DailyMotion: ' + dmMovies.length + ' movies');
              }
            } catch(e) { console.log('  ❌ DM error:', e.message); }
            
            // Bilibili
            let biliMovies = [];
            try {
              const bili = JSON.parse(fs.readFileSync('bili.json'));
              if (bili.code === 0 && bili.data && bili.data.result) {
                biliMovies = bili.data.result.map(v => ({
                  title: v.title ? v.title.replace(/<[^>]*>/g, '') : 'Bilibili Horror',
                  link: 'https://www.bilibili.com/video/' + v.bvid,
                  thumbnail: v.pic || 'https://via.placeholder.com/320x180/1f262e/6b7b8b?text=Bili',
                  description: (v.description || 'Full movie on Bilibili').slice(0, 100),
                  source: 'bilibili'
                }));
                console.log('  📺 Bilibili: ' + biliMovies.length + ' movies');
              }
            } catch(e) { console.log('  ❌ Bili error:', e.message); }
            
            // Combine all movies
            const allMovies = [...dmMovies, ...biliMovies];
            console.log('📊 Total movies: ' + allMovies.length);
            
            // Add IMDb ratings (simulated based on title)
            const moviesWithRatings = allMovies.map(m => {
              let hash = 0;
              for (let i = 0; i < m.title.length; i++) {
                hash = m.title.charCodeAt(i) + ((hash << 5) - hash);
              }
              const seed = Math.abs(hash) / 100000;
              const rating = (4.2 + (seed % 3.8));
              const imdbRating = Math.min(8.5, Math.max(3.5, rating)).toFixed(1);
              return { ...m, imdbRating };
            });
            
            // Save to horror/movies.json
            fs.writeFileSync('horror/movies.json', JSON.stringify(moviesWithRatings, null, 2));
            console.log('✅ Saved ' + moviesWithRatings.length + ' movies to horror/movies.json');
          "
          
      - name: Commit and push movies.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add horror/movies.json
          git diff --staged --quiet || git commit -m "🔄 Auto-update horror movies $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
          echo "✅ Changes committed and pushed!"
