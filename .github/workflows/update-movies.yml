name: Update Horror Movies

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-movies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Fetch DailyMotion movies
        run: |
          echo "📡 Fetching DailyMotion: horror full movie (limit 100)..."
          curl -s "https://api.dailymotion.com/videos?search=horror+full+movie&limit=100&fields=id,title,description,thumbnail_240_url" > dm.json
          
          # Check how many results
          DM_COUNT=$(cat dm.json | jq '.list | length' 2>/dev/null || echo "0")
          echo "✅ DailyMotion returned: $DM_COUNT movies"
          
      - name: Fetch Bilibili movies
        run: |
          echo "📡 Fetching Bilibili: horror full movie..."
          curl -s "https://api.bilibili.com/x/web-interface/search/type?search_type=video&keyword=horror%20full%20movie&page=1" > bili.json
          
          # Check how many results
          BILI_COUNT=$(cat bili.json | jq '.data.result | length' 2>/dev/null || echo "0")
          echo "✅ Bilibili returned: $BILI_COUNT movies"
          
      - name: Combine movies into JSON
        run: |
          node -e "
            const fs = require('fs');
            
            console.log('🔄 Combining movies from all sources...');
            
            // DailyMotion
            let dmMovies = [];
            try {
              const dm = JSON.parse(fs.readFileSync('dm.json'));
              if (dm.list && dm.list.length > 0) {
                dmMovies = dm.list.map(v => ({
                  title: v.title || 'Untitled Horror',
                  link: 'https://www.dailymotion.com/video/' + v.id,
                  thumbnail: v.thumbnail_240_url || 'https://via.placeholder.com/320x180/1f262e/6b7b8b?text=DM',
                  description: (v.description || 'Full horror movie on DailyMotion').slice(0, 150),
                  source: 'dailymotion'
                }));
                console.log('  📺 DailyMotion: ' + dmMovies.length + ' movies');
              } else {
                console.log('  📺 DailyMotion: 0 movies (empty response)');
              }
            } catch(e) { 
              console.log('  ❌ DM error:', e.message); 
              // Try fallback search
              try {
                const dmFallback = JSON.parse(fs.readFileSync('dm.json'));
                console.log('  📺 DailyMotion raw response:', JSON.stringify(dmFallback).slice(0, 200));
              } catch(e2) {}
            }
            
            // Bilibili
            let biliMovies = [];
            try {
              const bili = JSON.parse(fs.readFileSync('bili.json'));
              if (bili.code === 0 && bili.data && bili.data.result) {
                // Filter for English titles or horror content
                biliMovies = bili.data.result
                  .filter(v => {
                    const title = v.title || '';
                    // Keep movies with English titles or horror keywords
                    return title.match(/[a-zA-Z]/) || 
                           title.includes('horror') || 
                           title.includes('恐怖') ||
                           title.includes('惊悚');
                  })
                  .slice(0, 30)
                  .map(v => ({
                    title: v.title ? v.title.replace(/<[^>]*>/g, '').trim() : 'Bilibili Horror',
                    link: 'https://www.bilibili.com/video/' + v.bvid,
                    thumbnail: v.pic ? 'https:' + v.pic : 'https://via.placeholder.com/320x180/1f262e/6b7b8b?text=Bili',
                    description: (v.description || 'Full movie on Bilibili').slice(0, 100),
                    source: 'bilibili'
                  }));
                console.log('  📺 Bilibili: ' + biliMovies.length + ' movies (filtered)');
              } else {
                console.log('  📺 Bilibili: 0 movies or error');
              }
            } catch(e) { console.log('  ❌ Bili error:', e.message); }
            
            // Combine all movies
            const allMovies = [...dmMovies, ...biliMovies];
            console.log('📊 Total movies: ' + allMovies.length);
            
            // Add IMDb ratings (simulated)
            const moviesWithRatings = allMovies.map(m => {
              let hash = 0;
              for (let i = 0; i < m.title.length; i++) {
                hash = m.title.charCodeAt(i) + ((hash << 5) - hash);
              }
              const seed = Math.abs(hash) / 100000;
              const rating = (4.2 + (seed % 3.8));
              const imdbRating = Math.min(8.5, Math.max(3.5, rating)).toFixed(1);
              return { ...m, imdbRating };
            });
            
            // Save to horror/movies.json
            fs.writeFileSync('horror/movies.json', JSON.stringify(moviesWithRatings, null, 2));
            console.log('✅ Saved ' + moviesWithRatings.length + ' movies to horror/movies.json');
          "
          
      - name: Commit and push movies.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add horror/movies.json
          git diff --staged --quiet || git commit -m "🔄 Auto-update horror movies $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
          echo "✅ Changes committed and pushed!"
